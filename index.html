<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>독서</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="독서">
<meta name="theme-color" content="#351E1C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--ink:#351E1C;--lime:#FF6037;--coral:#FF6037;--pink:#733635;--pinkd:#733635;--mint:#A0C9CB;--snow:#F5F4ED;--muted:#BBA9A5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;word-break:keep-all;overflow-wrap:break-word;background:#351E1C;color:#F5F4ED;font-family:'Outfit','Noto Sans KR',sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.kr{font-family:'Noto Sans KR',sans-serif}
.h900{font-family:'Noto Sans KR',sans-serif;font-weight:900;letter-spacing:-.04em}
#app{min-height:100vh;padding-bottom:96px}
.pill{height:40px;padding:0 16px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll::after{content:'';flex:0 0 10px}
.tbtn.dk{background:#4D2F2C;color:#F5F4ED}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 하단 메뉴 */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:58px;border-radius:29px;background:rgba(53,30,28,.92);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.35)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs a.on{color:#fff;font-weight:700}
/* 재생 카드 */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100vh}
.carousel::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:start;position:relative;overflow:hidden;color:#351E1C;min-height:100vh;padding-bottom:100px}
.card .cover{position:absolute;left:50%;top:-30px;width:62vw;max-width:290px;aspect-ratio:2/3;object-fit:cover;margin-left:-31vw;transform:rotate(-7deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);background:#0002}
@media(min-width:470px){.card .cover{margin-left:-145px}}
.card:nth-child(even) .cover{transform:rotate(6deg)}
.glass{background:rgba(255,255,255,.75);color:#351E1C}
.scrub{height:4px;border-radius:2px;background:rgba(53,30,28,.2);position:relative}
.scrub>i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#351E1C}
.scrub>b{position:absolute;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.dots{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;z-index:5;pointer-events:none}
.dots span{width:6px;height:6px;border-radius:3px;background:rgba(53,30,28,.3)}.dots span.on{width:22px;background:#351E1C}
/* 리스트 */
.item{display:flex;align-items:center;gap:14px;padding:10px 20px}
.thumb{width:40px;height:58px;object-fit:cover;border-radius:3px;background:#4D2F2C;flex:none}
.tile{width:128px;height:128px;flex:none;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#351E1C;text-align:left}
.chip{height:34px;padding:0 14px;border-radius:17px;background:#4D2F2C;display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.chip.on{background:#fff;color:#351E1C;font-weight:700}
.mini{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));height:60px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 8px;color:#351E1C;overflow:hidden;z-index:15}
/* 시트 */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.open{display:block}
#sheet .dim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .panel{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-radius:30px;background:#F5F4ED;color:#351E1C;padding:22px}
.field{width:100%;border:0;border-radius:16px;background:#fff;padding:14px 16px;font-size:16px;outline:none}
textarea.field{resize:none;line-height:1.6}
.btn{height:56px;border-radius:28px;background:#351E1C;color:#fff;width:100%;font-size:16px;font-weight:700}
.btn2{height:44px;padding:0 16px;border-radius:22px;background:#fff;color:#351E1C;font-size:15px;font-weight:700}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#351E1C;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:60;display:none;max-width:90vw}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-size:15px}
/* 공통 레이아웃 규칙: 여백 20 · 크기 40/34/22/17/15/12 */
.tb{display:grid;grid-template-columns:minmax(44px,auto) 1fr minmax(44px,auto);align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;height:56px;box-sizing:content-box;position:relative;z-index:3}
.tb .c{text-align:center;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.pt{margin:8px 20px 0;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:34px;line-height:1.15;letter-spacing:-.04em}
.st{margin:32px 20px 12px;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:22px;line-height:1.2;letter-spacing:-.03em}
.bt{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:40px;line-height:1.08;letter-spacing:-.04em;margin:0}
.au{font-size:17px;font-weight:500;margin:6px 0 0}
.mt{font-size:12px;font-weight:700;margin:6px 0 0}
/* 가사 */
.lines p{margin:0;font-family:'Noto Sans KR',sans-serif;font-weight:900;letter-spacing:-.03em;transition:all .2s}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div id="sheet"><div class="dim" data-act="closeSheet"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
var S = { books: [], logs: [], quotes: [], tags: [], today: '', loaded: false,
  lib: { status: 'reading', tag: '', q: '' }, lines: { book: '', idx: 0 }, search: { q: '', items: null, tried: [], busy: false },
  tagSel: '', year: '', photos: {} };
var ST = { want: '읽고 싶음', reading: '읽는 중', done: '다 읽음', stopped: '그만 읽음' };
var PAL = ['#FF6037', '#A0C9CB', '#ECECDC'];
var OLD = { '#FF6037': '#FF6037', '#F2634A': '#FF6037', '#E2449C': '#A0C9CB', '#A8EBDD': '#A0C9CB', '#A9D3E6': '#A0C9CB', '#FFE45C': '#ECECDC', '#E2A454': '#ECECDC' };

/* ---------- 공통 ---------- */
/* 데이터는 Apps Script API 로. 열쇠(토큰)는 이 휴대폰에만 저장된다 */
var API = 'https://script.google.com/macros/s/AKfycbzSoPXcT92t5M1j_7sIq1N-yZqiDqnJTKVP9tWTjAVhPnFFu_hzhk1QchwlawDWx6sb/exec';
var TOKEN = (function () {
  var m = /[#&]t=([^&]+)/.exec(location.hash);
  try { if (m) { localStorage.setItem('dk_token', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); } return localStorage.getItem('dk_token') || ''; } catch (e) { return m ? decodeURIComponent(m[1]) : ''; }
})();
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, fn: fn, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error === 'unauthorized' ? '열쇠가 맞지 않아요' : j.error); return j.result; });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2200); }
function fail(e) { toast('저장하지 못했어요: ' + (e && e.message || e)); console.error(e); }
function book(id) { return S.books.find(function (b) { return b.id === id; }); }
function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
function pct(b) { var p = num(b.pages); return p ? Math.min(100, Math.round(num(b.currentPage) / p * 100)) : 0; }
function tagsOf(b) { return String(b.tags || '').split('|').filter(Boolean); }
function color(b) { var c = (b && b.color || '#FF6037').toUpperCase(); return OLD[c] || c; }
function lastAct(b) {
  var d = b.startDate || b.addedAt || '';
  S.logs.forEach(function (l) { if (l.bookId === b.id && l.date > d) d = l.date; });
  S.quotes.forEach(function (q) { if (q.bookId === b.id && q.createdAt > d) d = q.createdAt; });
  return d;
}
function reading() { return S.books.filter(function (b) { return b.status === 'reading'; }).sort(function (a, b) { return lastAct(b) > lastAct(a) ? 1 : -1; }); }
function queue() { return S.books.filter(function (b) { return b.queue; }).sort(function (a, b) { return num(a.queue) - num(b.queue); }); }
function quotesOf(id) { return S.quotes.filter(function (q) { return q.bookId === id; }).sort(function (a, b) { return num(a.page) - num(b.page) || (a.createdAt > b.createdAt ? 1 : -1); }); }
function replace(arr, obj) { var i = arr.findIndex(function (x) { return x.id === obj.id; }); if (i >= 0) arr[i] = obj; else arr.push(obj); }
function coverImg(b, cls, style) {
  if (b && b.cover) return '<img class="' + (cls || '') + '" src="' + esc(b.cover) + '" alt="" loading="lazy" style="' + (style || '') + '">';
  return '<div class="' + (cls || '') + '" style="' + (style || '') + ';background:' + color(b) + ';display:flex;align-items:flex-end;padding:8px;color:#351E1C;font-weight:900;font-size:12px;font-family:Noto Sans KR">' + esc(b ? b.title : '') + '</div>';
}
var I = {
  quote: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h4v4c0 3-1.5 5-4 6M14 7h4v4c0 3-1.5 5-4 6"/></svg>',
  cam: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  back: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  plus: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  menu: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h14M5 16h14"/></svg>',
  search: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  barcode: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>',
  shuffle: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.6 0 2.8-1.6 3.8-3.4M14 9.4C15 8 16.2 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
  share: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></svg>',
  read: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>',
  lib: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4v16M9 4v16M14 5l4 15"/></svg>',
  stat: '<svg width="ICON" height="ICON" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
};
function ic(n, s) { return I[n].replace(/ICON/g, s || 20); }
function topbar(l, c, rt, bg) { return '<header class="tb"' + (bg ? ' style="position:sticky;top:0;background:' + bg + '"' : '') + '>' + (l || '<span></span>') + '<div class="c">' + (c || '') + '</div>' + (rt || '<span></span>') + '</header>'; }
function tb(kind, icon, cls, extra) { return kind.charAt(0) === '#' ? '<a href="' + kind + '" class="tbtn ' + (cls || '') + '" style="' + (extra || '') + '">' + ic(icon, 20) + '</a>' : '<button data-act="' + kind + '" class="tbtn ' + (cls || '') + '" style="' + (extra || '') + '">' + ic(icon, 20) + '</button>'; }

/* ---------- 이동 ---------- */
/* Apps Script 웹앱은 iframe 안에서 돌아서 주소(#)로 이동하지 않고 앱 안 상태로 이동한다 */
S.r = 'reading'; S.hist = [];
function route() { var p = S.r.split('/'); return { view: p[0] || 'reading', id: p[1] || '' }; }
function go(h, noPush) { h = String(h || 'reading').replace(/^#/, ''); if (!noPush && h !== S.r) S.hist.push(S.r); S.r = h; render(); window.scrollTo(0, 0); }
function goBack() { go(S.hist.length ? S.hist.pop() : 'reading', true); }

function tabs(active) {
  var t = [['reading', '읽는 중', 'read'], ['library', '내 서재', 'lib'], ['lines', '문장', 'quote'], ['wrapped', '결산', 'stat']];
  return '<nav class="tabs">' + t.map(function (x) { return '<a href="#' + x[0] + '" class="' + (active === x[0] ? 'on' : '') + '">' + ic(x[2], 22) + x[1] + '</a>'; }).join('') + '</nav>';
}
function mini() {
  var b = reading()[0]; if (!b) return '';
  return '<div class="mini" style="background:' + color(b) + '">' +
    '<a href="#reading" class="row" style="gap:10px;flex:1;min-width:0">' + coverImg(b, '', 'width:44px;height:44px;object-fit:cover;object-position:top;border-radius:4px;flex:none') +
    '<div style="min-width:0"><div class="h900 ell" style="font-size:15px">' + esc(b.title) + '</div><div style="font-size:12px;font-weight:500">' + num(b.currentPage) + (b.pages ? ' / ' + b.pages + '쪽' : '쪽') + '</div></div></a>' +
    '<button data-act="pageSheet" data-id="' + b.id + '" style="width:44px;height:44px;font-size:12px;font-weight:800">+쪽</button>' +
    '<button data-act="quoteSheet" data-id="' + b.id + '" class="circle" style="width:44px;height:44px;background:#351E1C;color:' + color(b) + '">' + ic('quote', 18) + '</button>' +
    '<div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(53,30,28,.2)"><div style="width:' + pct(b) + '%;height:100%;background:#351E1C"></div></div></div>';
}

/* ---------- 화면 ---------- */
function render() {
  if (!S.loaded) return;
  var r = route(), html = '';
  document.body.style.background = '#351E1C';
  if (r.view === 'reading') html = vReading();
  else if (r.view === 'library') html = vLibrary();
  else if (r.view === 'book') html = vBook(r.id);
  else if (r.view === 'lines') html = vLines(r.id);
  else if (r.view === 'wrapped') html = vWrapped();
  else if (r.view === 'search') html = vSearch();
  else if (r.view === 'tags') html = vTags();
  else html = vReading();
  document.getElementById('app').innerHTML = html;
  after(r);
}
function after(r) {
  if (r.view === 'reading') {
    var c = document.querySelector('.carousel'); if (!c) return;
    c.addEventListener('scroll', function () {
      var i = Math.round(c.scrollLeft / c.clientWidth);
      document.querySelectorAll('.dots span').forEach(function (d, j) { d.className = j === i ? 'on' : ''; });
    });
  }
  if (r.view === 'search') { var q = document.getElementById('sq'); if (q && !S.search.items) q.focus(); }
  if (r.view === 'lines') { var cur = document.querySelector('[data-cur="1"]'); if (cur) cur.scrollIntoView({ block: 'center' }); loadPhotos(); }
  if (r.view === 'book') loadPhotos();
}

/* 읽는 중 */
function vReading() {
  var list = reading();
  if (!list.length) {
    return '<div style="min-height:100vh;background:var(--lime);color:#351E1C">' + topbar('', '', tb('#search', 'plus', 'glass')) +
      '<h1 class="pt">읽는 중인<br>책이 없어요</h1><div style="padding:0 20px">' +
      '<p style="font-size:15px;margin:12px 0 24px">서재에서 고르거나 새 책을 찾아 넣어 보세요.</p>' +
      '<div class="row" style="gap:8px"><a class="pill" style="background:#351E1C;color:#fff;height:48px" href="#library">서재에서 고르기</a><a class="pill" style="background:#fff;height:48px" href="#search">책 찾기</a></div>' +
      (queue().length ? '<div class="st" style="margin:32px 0 12px">다음에 읽을 책</div><div class="row" style="gap:10px;margin-top:10px;overflow-x:auto">' + queue().map(function (b) { return '<button data-act="startBook" data-id="' + b.id + '">' + coverImg(b, '', 'width:90px;height:132px;object-fit:cover;border-radius:4px') + '</button>'; }).join('') + '</div>' : '') +
      '</div></div>' + tabs('reading');
  }
  var cards = list.map(function (b, i) {
    var p = pct(b), nq = quotesOf(b.id).length;
    return '<section class="card" style="background:' + color(b) + '">' + coverImg(b, 'cover') +
      topbar(tb('#search', 'plus', 'glass'), '<span class="pill glass" style="height:28px;font-size:12px">읽는 중 · ' + (i + 1) + '/' + list.length + '</span>', tb('#book/' + b.id, 'menu', 'glass')) +
      '<div style="position:relative;margin-top:min(88vw,380px);padding:0 20px">' +
      '<h1 class="bt" style="margin-right:-40px;white-space:nowrap;overflow:hidden">' + esc(b.title) + '</h1>' +
      '<p class="au ell">' + esc(b.author) + '</p>' +
      '<p class="mt row"><span style="width:12px;height:12px;border-radius:6px;background:#351E1C;margin-right:6px"></span>' + esc([b.publisher, b.pages ? b.pages + '쪽' : ''].filter(Boolean).join(' · ')) + '</p>' +
      '<div class="row" style="margin-top:24px;gap:16px"><div style="flex:1">' +
      '<div class="scrub"><i style="width:' + p + '%"></i><b style="left:' + p + '%"></b></div>' +
      '<div style="margin-top:10px;font-size:12px;font-weight:700">' + num(b.currentPage) + ' <span style="font-weight:500;opacity:.6">/ ' + (b.pages || '?') + '쪽 · ' + p + '%</span></div></div>' +
      '<button data-act="quoteSheet" data-id="' + b.id + '" class="circle" style="width:72px;height:72px;background:#fff;color:#351E1C;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)">' + ic('quote', 30) + '</button></div>' +

  },
  quote: function (f) {
    var id = f.dataset.id, ph = S._photo, data = { bookId: id, page: f.page.value, text: f.text.value.trim(), thought: f.thought.value.trim() };
    if (!data.text && !ph) { toast('문장이나 사진을 넣어 주세요'); return; }
    if (ph) { data.photo = ph.b64; data.mime = 'image/jpeg'; }
    closeSheet(); toast('저장하는 중…');
    call('addQuote', data).then(function (q) { if (ph) S.photos[q.photoId] = ph.url; S.quotes.push(q); toast('문장을 남겼어요'); render(); }).catch(fail);
  },
  edit: function (f) {
    var patch = {}; ['title', 'author', 'publisher', 'pages', 'currentPage', 'startDate', 'endDate', 'memo', 'cover'].forEach(function (k) { patch[k] = f[k].value.trim(); });
    closeSheet(); saveBook(f.dataset.id, patch);
  },
  tagAdd: function (f) { call('tagAdd', f.t.value).then(function (t) { S.tags = t; render(); }).catch(fail); },
  tagAddBook: function (f) {
    var id = f.dataset.id, v = f.t.value.trim(); if (!v) return;
    call('tagAdd', v).then(function (t) { S.tags = t; var b = book(id), tg = tagsOf(b); if (tg.indexOf(v) < 0) tg.push(v); return saveBook(id, { tags: tg.join('|') }); }).then(function () { tagSheet(id); }).catch(fail);
  },
  manual: function (f) {
    var b = { title: f.title.value.trim(), author: f.author.value.trim(), publisher: f.publisher.value.trim(), pages: f.pages.value.trim(), status: f.status.value, source: '직접' };
    closeSheet(); call('addBook', b).then(function (r) { replace(S.books, r.book); go('book/' + r.book.id); }).catch(fail);
  },
  ask: function (f) { var v = f.v.value.trim(), cb = S._ask; closeSheet(); if (v && cb) cb(v); }
};

function saveBook(id, patch) {
  var b = book(id); Object.assign(b, patch); render();
  return call('updateBook', id, patch).then(function (nb) { replace(S.books, nb); render(); return nb; }).catch(function (e) { fail(e); });
}
function askDone(b) { confirmSheet('「' + esc(b.title) + '」<br>다 읽음으로 바꿀까요?', '다 읽었어요', function () { saveBook(b.id, { status: 'done' }).then(afterDone); }); }
function afterDone(b) {
  var n = queue()[0];
  if (n) confirmSheet('다음 책<br>「' + esc(n.title) + '」<br>시작할까요?', '시작하기', function () { saveBook(n.id, { status: 'reading' }); go('reading'); }, '나중에');
}
function doSearch() {
  var q = S.search.q.trim(); if (!q) return;
  S.search.busy = true; S.search.items = []; render();
  call('searchBooks', q).then(function (r) { S.search.items = r.items; S.search.tried = r.tried; S.search.busy = false; render(); })
    .catch(function (e) { S.search.busy = false; S.search.items = []; S.search.tried = ['오류: ' + (e.message || e)]; render(); });
}

/* 사진 */
function pickImage(cb, raw) {
  var inp = document.getElementById('fileIn'); inp.value = '';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var max = raw ? 2000 : 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var d = c.toDataURL('image/jpeg', .85);
      cb({ url: d, b64: d.split(',')[1], canvas: c, img: img });
    };
    img.src = url;
  };
  inp.click();
}
function loadPhotos() {
  document.querySelectorAll('img[data-photo]').forEach(function (el) {
    var id = el.dataset.photo; if (S.photos[id]) { el.src = S.photos[id]; return; }
    call('photoData', id).then(function (d) { S.photos[id] = d; document.querySelectorAll('img[data-photo="' + id + '"]').forEach(function (x) { x.src = d; }); }).catch(function () {});
  });
}
function readBarcode(ph) {
  var isbn = function (t) { t = String(t || '').replace(/[^0-9X]/g, ''); return /^97[89]\d{10}$/.test(t) || t.length === 10 ? t : ''; };
  var z = function () {
    try { var r = new ZXing.BrowserMultiFormatReader(); return r.decodeFromImageElement(ph.img).then(function (x) { return isbn(x.getText()); }).catch(function () { return ''; }); }
    catch (e) { return Promise.resolve(''); }
  };
  if ('BarcodeDetector' in window) {
    try { return new BarcodeDetector({ formats: ['ean_13'] }).detect(ph.canvas).then(function (r) { return r.length ? isbn(r[0].rawValue) : z(); }).catch(z); } catch (e) {}
  }
  return z();
}

/* 문장 카드 이미지 (스토리 크기) */
function cardImage(q) {
  if (!q) return;
  var b = book(q.bookId) || {}, c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  var x = c.getContext('2d'); x.fillStyle = color(b); x.fillRect(0, 0, 1080, 1920);
  x.fillStyle = '#351E1C'; x.font = '900 46px "Noto Sans KR"'; x.fillText(b.title || '', 96, 200);
  x.font = '500 34px "Noto Sans KR"'; x.fillText((b.author || '') + (q.page ? ' · ' + q.page + '쪽' : ''), 96, 256);
  x.font = '900 72px "Noto Sans KR"'; var lines = wrap(x, q.text || '', 888), y = 520;
  lines.slice(0, 14).forEach(function (l) { x.fillText(l, 96, y); y += 104; });
  if (q.thought) { x.font = '700 38px "Noto Sans KR"'; wrap(x, q.thought, 888).slice(0, 4).forEach(function (l) { y += 10; x.fillText(l, 96, y + 40); y += 56; }); }
  x.font = '800 30px Outfit'; x.fillText('독서 · 문장', 96, 1820);
  var url = c.toDataURL('image/png');
  openSheet(sheetHead(b, '길게 눌러 사진에 저장') + '<img src="' + url + '" style="width:100%;border-radius:16px;margin-top:14px"><a class="btn" style="display:flex;align-items:center;justify-content:center;margin-top:12px" href="' + url + '" download="문장.png">내려받기</a>');
  function wrap(ctx, t, w) { var out = [], line = ''; String(t).split('').forEach(function (ch) { if (ch === '\n') { out.push(line); line = ''; return; } var test = line + ch; if (ctx.measureText(test).width > w && line) { out.push(line); line = ch; } else line = test; }); if (line) out.push(line); return out; }
}

/* 이벤트 */
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href^="#"]');
  if (a && !e.target.closest('[data-act]')) { e.preventDefault(); go(a.getAttribute('href')); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset, el);
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); FORM[f.dataset.form](f);
});
document.addEventListener('input', function (e) {
  if (e.target.dataset.input === 'libQ') {
    S.lib.q = e.target.value; clearTimeout(S._qt);
    S._qt = setTimeout(function () { var pos = e.target.selectionStart; render(); var i = document.querySelector('[data-input="libQ"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 250);
  }
});

function load(all) { S.books = all.books; S.logs = all.logs; S.quotes = all.quotes; S.tags = all.tags; S.today = all.today; S.loaded = true; }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
if (!TOKEN) document.getElementById('app').innerHTML = '<div class="loading" style="flex-direction:column;gap:8px;padding:40px;text-align:center"><b style="font-size:22px;color:#F5F4ED">열쇠가 없어요</b>맥에 띄운 QR 코드로 한 번 열면 이 휴대폰에 저장돼요.</div>';
else call('getAll').then(function (all) { load(all); if (!all.hasKey) toast('카카오 키가 없어 검색이 안 됩니다'); render(); })
  .catch(function (e) { document.getElementById('app').innerHTML = '<div class="loading">불러오지 못했어요: ' + esc(e.message || e) + '</div>'; });
</script>
